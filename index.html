<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Studio Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="directory-block">
            <div class="directory-logo-block">
                <img class="logo"  src="./assets/logo.png" alt="">
                <p class="directory-logo-title" >Разработка соврененых <br> <span class="cursor-font">IT-Решений</span></p>
            </div>
            <div class="directory-contact-block">
                <div class="order-block">
                    <p>Заказать звонок</p>
                </div>
                <div class="directory-vk-block">
                    <img class="directory-vk" src="./assets/vk.png" alt="">
                </div>
            </div>
        </div>
        <!--    DIRECTORY    -->
        <div class="header-catalog-block">
            <div class="catalog-block">
                <div class="catalog-line active-catalog-line"></div>
                <button class="active-catalog-button">Создание сайта</button>
            </div>
            <div class="catalog-block">
                <div class="catalog-line"></div>
                <button>Примеры наших работ</button>
            </div>
            <div class="catalog-block">
                <div class="catalog-line"></div>
                <button>Стоимость разработки сайтоа</button>
            </div>
            <div class="catalog-block">
                <div class="catalog-line"></div>
                <button>Оставить заявку</button>
            </div>
            <div class="catalog-block">
                <div class="catalog-line"></div>
                <button>Контакты</button>
            </div>
        </div>
        <!--      CATALOG      -->
        <div class="header-content">
            <div class="right-half-header-block">
                <div class="header-title-block">
                    <h1>Разработка <span class="header-title-cursor">сайтов</span> <br> под ключ</h1>
                </div>
                <div class="header-bio-block">
                    <p>Разработка сайтов от 3-х дней</p>
                    <p>Бесплатная SEO-Оптимизация</p>
                    <p>Логотип для сайта в подарок</p>
                </div>
                <div class="header-aboutUs-bloсk">
                    <button>Хочу сайт</button>
                    <div class="header-audio-block">
                        <div class="audio-button-block">
                            <button><img src="./assets/play.png" alt="О нас"></button>
                        </div>
                        <div class="audio-time-block">
                            <p>О нас за пару минут!</p>
                            <p class="header-audio-time">2: 32</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="left-half-header-block">
                <div class="agreement-block">
                    <div class="agreement-icon-block">
                        <img src="./assets/agreement-icon.png" alt="" class="agreement-icon">
                    </div>
                    <h2>Договор</h2>
                    <p>Работа через договор с заказчиком</p>
                </div>
                <img src="./assets/дед.png" class="header-img" alt="Дед">
                <div class="guarante-block">
                    <div class="guarante-icon-block">
                        <img src="./assets/guarante-icon.png" alt="" class="guarante-icon">
                    </div>
                    <h2>Гарантия</h2>
                    <p>Даем гарантию на сайт 365 дней</p>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
